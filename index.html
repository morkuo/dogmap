<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>狗狗從哪裡來</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen atlas. The map fills the window; controls float at the top, the dog's card pops up beside its pin (bottom sheet on phones). */
:root {
  --sea: #dfe9ec;
  --land: #f7f8f4;
  --land-hi: #dfe8cf;
  --border: #b9c6c4;
  --ink: #1c2a2f;
  --ink-soft: #55666b;
  --paper: #fcfdfb;
  --rule: #d5dfdd;
  --accent: #2346c4;
  --accent-soft: #e3e9ff;
  --amber: #c96f12;
  --amber-soft: #fbecd9;
  --amber-ink: #9a4f06; /* amber for text: 5:1+ on light backgrounds */
  --note-bg: #f4f1e2;
  --shadow: 0 10px 30px rgba(20, 40, 50, .18), 0 2px 6px rgba(20, 40, 50, .08);
  --font-display: "LXGW WenKai TC", "Klee One", "Kaiti TC", "BiauKai", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --sea: #0f1a1e; --land: #1d2b30; --land-hi: #3d5a44; --border: #3a4d52;
    --ink: #e6eeee; --ink-soft: #9fb1b4; --paper: #152126; --rule: #2b3b40;
    --accent: #8fa8ff; --accent-soft: #23305c; --amber: #f2a54f; --amber-soft: #3d2c17; --amber-ink: #f2a54f;
    --note-bg: #232a22; --shadow: 0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --sea: #0f1a1e; --land: #1d2b30; --land-hi: #3d5a44; --border: #3a4d52;
  --ink: #e6eeee; --ink-soft: #9fb1b4; --paper: #152126; --rule: #2b3b40;
  --accent: #8fa8ff; --accent-soft: #23305c; --amber: #f2a54f; --amber-soft: #3d2c17; --amber-ink: #f2a54f;
  --note-bg: #232a22; --shadow: 0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--sea); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.75;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, .pin:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { position: relative; height: 100%; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.app.zoomed #map { cursor: grab; }
.app.zoomed #map:active { cursor: grabbing; }
.app.zoomed .pin { cursor: pointer; }
.panhint {
  position: absolute; z-index: 6; right: calc(max(12px, env(safe-area-inset-right, 0px)) + 46px); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  background: var(--ink); color: var(--paper); font-size: 13px; padding: 5px 12px; border-radius: 8px; pointer-events: none;
  transition: opacity .3s ease;
}
.country { fill: var(--land); stroke: var(--border); stroke-width: .6; vector-effect: non-scaling-stroke; }
.country.hi { fill: var(--land-hi); }
.grat { fill: none; stroke: var(--border); stroke-opacity: .35; stroke-width: .5; vector-effect: non-scaling-stroke; }
.pin { cursor: pointer; }
.pin circle.dot { stroke: var(--paper); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.pin.common circle.dot { fill: var(--accent); }
.pin.local circle.dot { fill: var(--amber); }
/* While one kind is filtered, every visible dot takes that kind's color. */
.app.only-common .pin circle.dot { fill: var(--accent); }
.app.only-local .pin circle.dot { fill: var(--amber); }
.legend .kindbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: none; color: var(--ink-soft); font-size: 12px; padding: 2px 8px; border-radius: 999px; cursor: pointer; text-decoration: none; }
.legend .kindbtn:hover { border-color: var(--rule); }
.legend .kindbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.legend .kindbtn[aria-pressed="true"] i { box-shadow: 0 0 0 1.5px var(--paper); }
.pin .ring { fill: none; stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; opacity: 0; }
.pin.sel .ring { opacity: 1; }
/* Keyboard focus on map dots and stars (SVG does not show the default outline reliably). */
.pin:focus, .fam:focus { outline: none; }
.pin:focus-visible .ring { opacity: 1; stroke: var(--accent); stroke-width: 3; }
.fam:focus-visible path { stroke: var(--accent); stroke-width: 3; }
.pin .hit { fill: transparent; }
.pin text { font-family: var(--font-display); fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-linejoin: round; pointer-events: none; }
.pin[hidden] { display: none; }
.rel { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: .75; pointer-events: none; }
.rel.on { stroke-width: 3; stroke-dasharray: none; opacity: 1; }
.pin.relpin .ring { opacity: 1; stroke: var(--accent); stroke-dasharray: 2 3; }
.app.quizmode .rel { display: none; }

/* Floating chrome */
.bar {
  position: absolute; z-index: 5;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; pointer-events: none;
}
.bar > * { pointer-events: auto; }
.brand {
  background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 6px 14px; display: flex; align-items: baseline; gap: 10px;
}
h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.3; margin: 0; letter-spacing: .02em; }
.brand .count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--rule); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
.seg button { border: 0; background: transparent; color: var(--ink-soft); font-size: 14px; padding: 5px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.search input {
  font: inherit; font-size: 14px; width: 220px; max-width: 100%;
  padding: 7px 14px; border-radius: 999px; border: 1px solid var(--rule);
  background: var(--paper); color: var(--ink); box-shadow: var(--shadow);
}
.search input::placeholder { color: var(--ink-soft); }
.listbtn { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; box-shadow: var(--shadow); }
.listbtn[aria-expanded="true"] { background: var(--ink); color: var(--paper); }

.mapctl { position: absolute; z-index: 4; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; flex-direction: column; gap: 6px; }
.mapctl button { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--rule); background: var(--paper); font-size: 18px; line-height: 1; cursor: pointer; box-shadow: var(--shadow); }
.legend {
  position: absolute; z-index: 4; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center;
  background: var(--paper); border: 1px solid var(--rule); border-radius: 9px; padding: 4px 12px;
  font-size: 12px; color: var(--ink-soft); box-shadow: var(--shadow); max-width: calc(100% - 90px);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend button { border: 0; background: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.tip {
  position: absolute; z-index: 6; pointer-events: none; background: var(--ink); color: var(--paper);
  font-family: var(--font-display); font-size: 14px; padding: 2px 10px; border-radius: 6px; white-space: nowrap;
  transform: translate(-50%, calc(-100% - 10px));
}

/* Popup card */
.pop {
  position: absolute; z-index: 8; width: 370px; max-width: calc(100vw - 24px);
  background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  transition: opacity .18s ease, transform .18s ease;
}
.pop[hidden] { display: none !important; }
.pop.enter { opacity: 0; transform: translateY(6px) scale(.98); }
.grip {
  position: absolute; z-index: 4; top: 0; left: 50%; transform: translateX(-50%);
  width: 120px; height: 22px; display: grid; place-items: center; cursor: grab; touch-action: none;
  border: 0; background: transparent; padding: 0;
}
.grip::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.85); box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.pop .photo { cursor: grab; touch-action: none; }
.pop.dragging, .pop.dragging .photo, .pop.dragging .grip { cursor: grabbing; user-select: none; transition: none; }
.pop .arrow { position: absolute; z-index: 0; width: 14px; height: 14px; background: var(--paper); border: 1px solid var(--rule); transform: rotate(45deg); top: var(--ay, 40px); }
.pop.right .arrow { left: -8px; border-right: 0; border-top: 0; }
.pop.left .arrow { right: -8px; border-left: 0; border-bottom: 0; }
.pop .scroll { overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; position: relative; z-index: 1; background: var(--paper); border-radius: var(--r) var(--r) 0 0; }
.close {
  position: absolute; z-index: 3; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%;
  border: 0; background: color-mix(in srgb, var(--paper) 85%, transparent); font-size: 18px; line-height: 1; cursor: pointer;
}
.photo { position: relative; aspect-ratio: 3 / 2; max-width: 100%; background: var(--rule); flex: none; margin: 0; overflow: hidden; }
.photo::before { content: ""; position: absolute; inset: -16px; background: var(--bg) center / cover no-repeat; filter: blur(14px) brightness(.75); }
.photo img { position: relative; width: 100%; height: 100%; object-fit: contain; display: block; }
.photo figcaption { z-index: 1; }
.photo figcaption {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 10px 4px; font-size: 10.5px; line-height: 1.4;
  color: #f2f5f5; background: linear-gradient(transparent, rgba(0,0,0,.6));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.photo figcaption a { color: inherit; }
.body { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; letter-spacing: .08em; color: var(--ink-soft); }
.tag { font-size: 12px; letter-spacing: .04em; padding: 0 9px; border-radius: 999px; }
.tag.common { background: var(--accent-soft); color: var(--accent); }
.tag.local { background: var(--amber-soft); color: var(--amber-ink); }
.names { display: flex; flex-direction: column; gap: 2px; }
.names h2 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.25; margin: 0; text-wrap: balance; }
.names .row { display: grid; grid-template-columns: 26px 1fr; gap: 6px; align-items: baseline; }
.names .lab { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); letter-spacing: .06em; }
.names .ja { font-family: var(--font-display); font-size: 17px; }
.names .aka { font-size: 13px; color: var(--ink-soft); margin: -2px 0 4px; }
.names .en { font-size: 15px; font-weight: 500; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13.5px; border-block: 1px solid var(--rule); padding-block: 8px; margin: 0; }
.meta dt { color: var(--ink-soft); }
.meta dd { margin: 0; }
.meta .coord { font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.story { margin: 0; font-size: 15px; line-height: 1.9; }
.note { background: var(--note-bg); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; line-height: 1.75; }
.note b { margin-right: 4px; }
.sub { font-size: 12px; letter-spacing: .08em; color: var(--ink-soft); margin: 0 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-display); font-size: 14px; border: 1px solid var(--rule); background: var(--paper); padding: 2px 12px; border-radius: 999px; cursor: pointer; }
.chip:hover { border-color: var(--ink-soft); }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.local { border-color: color-mix(in srgb, var(--amber) 45%, var(--rule)); }
.sources { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
.srcbox summary { font-size: 12px; letter-spacing: .08em; color: var(--ink-soft); cursor: pointer; padding-block: 4px; list-style-position: inside; }
.srcbox summary:hover { color: var(--ink); }
.drawer .progress { font-family: var(--font-display); font-size: 15px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
.drawer .progress small { font-family: var(--font-body); font-size: 12px; color: var(--ink-soft); }
.sources a { color: var(--accent); text-underline-offset: 2px; }
.nav { display: flex; justify-content: space-between; gap: 8px; padding: 10px 18px; border-top: 1px solid var(--rule); background: var(--paper); position: relative; z-index: 2; flex: none; border-radius: 0 0 var(--r) var(--r); }
.nav button { font-size: 13.5px; border: 1px solid var(--rule); background: var(--paper); padding: 4px 12px; border-radius: 8px; cursor: pointer; }

/* List drawer */
.drawer {
  position: absolute; z-index: 7;
  top: calc(env(safe-area-inset-top, 0px) + 64px); left: max(12px, env(safe-area-inset-left, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 60px);
  width: 320px; max-width: calc(100vw - 24px);
  background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow);
  overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px;
}
.drawerctl { display: flex; flex-direction: column; gap: 8px; }
.drawerctl:empty { display: none; }
.drawerctl .seg, .drawerctl .worksel select, .drawerctl .search input { box-shadow: none; }
.drawerctl .seg { flex-wrap: wrap; border-radius: 14px; }
.drawerctl .search { flex: none; }
.drawerlist { display: flex; flex-direction: column; gap: 14px; }
.drawer h3 { font-family: var(--font-display); font-size: 17px; margin: 0 0 6px; display: flex; align-items: baseline; gap: 8px; }
.drawer h3 small { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); font-weight: 400; }
.drawer .about { font-size: 12.5px; color: var(--ink-soft); line-height: 1.7; border-top: 1px solid var(--rule); padding-top: 10px; margin: 0; }
.empty { color: var(--ink-soft); font-size: 14px; }

/* Phone: card becomes a bottom sheet */
@media (max-width: 640px) {
  h1 { font-size: 17px; }
  .brand { padding: 6px 12px; }
  .brand .count { display: none; }
  .search { flex: 1 1 140px; }
  .search input { width: 100%; }
  .pop {
    left: 0 !important; right: 0; top: auto !important; bottom: 0; width: auto; max-width: none;
    height: 46%; border-radius: 16px 16px 0 0; border-bottom: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .pop .arrow { display: none; }
  .pop .scroll { flex: 1; min-height: 0; max-height: none !important; border-radius: 16px 16px 0 0; }
  .nav { border-radius: 0; }
  .photo { aspect-ratio: 16 / 9; }
  .grip::before { background: var(--ink-soft); box-shadow: none; }
  .grip { top: -2px; }
  .drawer { width: auto; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 112px); }
}
/* Filters, name myths, sharing */
.worksel select {
  font: inherit; font-size: 14px; padding: 6px 30px 6px 14px; border-radius: 999px; border: 1px solid var(--rule);
  background: var(--paper); color: var(--ink); box-shadow: var(--shadow); cursor: pointer;
  appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
  background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat;
}
.quizbtn { border: 0; background: var(--accent); color: var(--paper); border-radius: 999px; padding: 6px 16px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow); }
.myth { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 14px; line-height: 1.7; }
.myth b { color: var(--accent); margin-right: 4px; }
.etym { background: var(--amber-soft); border-radius: 8px; padding: 8px 12px; font-size: 14px; line-height: 1.7; }
.etym b { color: var(--amber-ink); margin-right: 4px; }
.wtag { font-size: 12px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-soft); letter-spacing: .04em; }
.share { align-self: flex-start; font-size: 13px; border: 1px solid var(--rule); background: var(--paper); padding: 3px 12px; border-radius: 8px; cursor: pointer; color: var(--ink-soft); }

/* Quiz */
.app.quizmode .pin, .app.quizmode .seg, .app.quizmode .search, .app.quizmode .listbtn,
.app.quizmode .worksel, .app.quizmode .legend, .app.quizmode .quizbtn, .app.quizmode .timebtn, .app.quizmode .brand .count { display: none; }
.app.quizmode #map { cursor: crosshair; }
.quiz {
  position: absolute; z-index: 9; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  width: 460px; max-width: calc(100vw - 24px);
  background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
}
.qhead { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.qdog { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: center; }
.qdog img { width: 92px; height: 92px; object-fit: cover; border-radius: 8px; display: block; }
.qname { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.3; }
.qsub { font-size: 13.5px; color: var(--ink-soft); line-height: 1.6; }
.qask { margin: 0; font-size: 15px; }
.qask b { color: var(--accent); }
.qbig { font-family: var(--font-display); font-size: 24px; line-height: 1.3; margin: 0; }
.qbig small { font-family: var(--font-body); font-size: 14px; color: var(--ink-soft); margin-left: 6px; }
.qfact { margin: 0; font-size: 14px; line-height: 1.75; }
.qbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.qbtns button { font-size: 13.5px; border: 1px solid var(--rule); background: var(--paper); padding: 4px 12px; border-radius: 8px; cursor: pointer; }
.qbtns .primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.qlist { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 13.5px; max-height: 180px; overflow-y: auto; margin: 0; }
.qlist dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.qline { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.qguess { fill: var(--paper); stroke: var(--ink); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
.qans { fill: var(--amber); stroke: var(--paper); stroke-width: 2; vector-effect: non-scaling-stroke; }
.qlabel { font-family: var(--font-display); fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-linejoin: round; pointer-events: none; }
@media (max-width: 640px) {
  .seg { max-width: 100%; overflow-x: auto; }
  .quiz { left: 0; right: 0; transform: none; width: auto; max-width: none; bottom: 0; border-radius: 16px 16px 0 0; border-bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
  .qdog { grid-template-columns: 72px 1fr; }
  .qdog img { width: 72px; height: 72px; }
}
/* Famous dogs, journeys, collection */
.fam { cursor: pointer; }
.fam path { fill: var(--ink); stroke: var(--paper); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.fam.sel path { fill: var(--amber); }
.app.nofam .fam, .app.quizmode .fam, .app.quizmode .trip { display: none; }
.legend .famtoggle { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-soft); text-decoration: none; }
.legend .famtoggle[aria-pressed="false"] { opacity: .55; text-decoration: line-through; }
.legend .famtoggle svg { width: 11px; height: 11px; fill: var(--ink); }
.trip path.leg { fill: none; stroke: var(--amber); stroke-width: 2.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.trip circle { fill: var(--amber); stroke: var(--paper); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.trip circle.on { fill: var(--ink); }

  transition: opacity .35s ease; white-space: nowrap; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis;
}

.tl .tlyear { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tl .tlyear small { font-family: var(--font-body); font-weight: 400; font-size: 13px; color: var(--ink-soft); margin-left: 8px; }

.tl .tlbtns .primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tl input[type=range] { width: 100%; accent-color: var(--amber); margin: 0; }

/* Quiz chooser + photo quiz */
.qmodes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Touch screens: every control gets a finger-sized target (about 44px). */

/* First-visit hint */
.welcome {
  position: absolute; z-index: 11; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); width: 440px; max-width: calc(100vw - 24px);

}

.app.quizmode .welcome, .app.timemode .welcome { display: none; }
@media (max-width: 640px) { .welcome { top: calc(env(safe-area-inset-top, 0px) + 64px); bottom: auto; } }
/* Tap a country: list its dogs */

  padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; max-width: min(320px, calc(100vw - 24px)); }

<div class="app" id="app">
  <svg id="map" role="img" aria-label="世界地圖，標出各犬種的原產地"></svg>

  <div class="bar">
    <div class="brand"><h1>狗狗從哪裡來</h1><span class="count" id="count"></span></div>
    <div class="seg"><button type="button" id="mode-myth" aria-pressed="false" title="只看名字和真正產地不一樣的狗">名字的誤會</button></div>
    <label class="worksel"><select id="work" aria-label="依原本的工作篩選"><option value="">所有工作</option></select></label>
    <label class="search"><input id="q" type="search" placeholder="搜尋：柴犬、拉不拉多、プードル、Beagle…" aria-label="搜尋狗狗名稱"></label>
    <button type="button" class="listbtn" id="listbtn" aria-expanded="false" aria-controls="drawer">犬種列表</button>
    <button type="button" class="quizbtn" id="quizbtn">猜猜看</button>
    <button type="button" class="timebtn" id="timebtn">年表</button>
  </div>

  <aside class="drawer" id="drawer" hidden><div class="drawerctl" id="drawerctl"></div><div id="drawerlist" class="drawerlist"></div></aside>

  <div class="legend">
    <button type="button" class="kindbtn" data-kind="common" aria-pressed="false" title="只看世界常見的狗（再按一次顯示全部）"><i style="background:var(--accent)"></i>世界常見</button>
    <button type="button" class="kindbtn" data-kind="local" aria-pressed="false" title="只看各地特色犬（再按一次顯示全部）"><i style="background:var(--amber)"></i>在地特色</button>
    <button type="button" class="famtoggle" id="famtoggle" aria-pressed="true" title="顯示或隱藏歷史上的名犬"><svg viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0,-9L2.6,-3.2L8.8,-2.8L4.1,1.3L5.5,7.4L0,4.1L-5.5,7.4L-4.1,1.3L-8.8,-2.8L-2.6,-3.2Z"/></svg>名犬</button>
    <button type="button" id="rand">隨機一隻</button>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="cpick" id="cpick" hidden role="dialog" aria-label="選一隻狗"></div>
  <div class="welcome" id="welcome" hidden role="dialog" aria-label="怎麼玩">
    <p><b>點地圖上的圓點</b>，認識每種狗的老家和小故事。★ 是歷史上的名犬；想玩遊戲就按「猜猜看」，想看犬種怎麼一路出現就按「年表」。</p>
    <button type="button" id="welcomeok">知道了</button>
  </div>
  <div class="panhint" id="panhint" hidden>放大後可以拖曳地圖來移動</div>
  <div class="mapctl">
    <button type="button" id="zin" aria-label="放大">+</button>
    <button type="button" id="zout" aria-label="縮小">−</button>
    <button type="button" id="zreset" aria-label="回到全圖" style="font-size:14px">⤢</button>
  </div>
  <div class="tip" id="tip" hidden></div>

  <section class="quiz" id="quiz" hidden aria-live="polite"></section>
  <section class="tl" id="tl" hidden aria-label="犬種年表">
    <div class="tlhead">
      <div class="tlyear" id="tlyear">1550</div>
      <div class="tlbtns"><button type="button" class="primary" id="tlplay">暫停</button><button type="button" id="tlclose">結束年表</button></div>
    </div>
    <input type="range" id="tlrange" min="1550" max="2026" step="1" value="1550" aria-label="拖曳選擇年份">
    <div class="ticks" id="tlticks" aria-hidden="true"></div>
    <p class="tlevent" id="tlevent" aria-live="polite"></p>
    <p class="tlnote">只列出有明確年份紀錄的事件，來源見各犬種卡片；灰點是年份未定的犬種。</p>
  </section>

  <article class="pop" id="pop" hidden aria-live="polite">
    <span class="arrow"></span>
    <button type="button" class="grip" id="grip" aria-label="拖曳來移動卡片（手機上可以調整高度）" title="拖曳來移動卡片"></button>
    <button type="button" class="close" id="close" aria-label="關閉">×</button>
    <div class="scroll" id="popscroll"></div>
    <div class="nav">
      <button type="button" data-step="-1">← 上一隻</button>
      <button type="button" data-step="1">下一隻 →</button>
    </div>
  </article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="world.js"></script>
<script src="data.js"></script>
<script>
(function () {
  const DOGS = window.DOGS, REGIONS = window.REGIONS, PHOTOS = window.PHOTOS || {};
  const FAMOUS = window.FAMOUS || [], TRIPS = window.TRIPS || {};
  const famById = Object.fromEntries(FAMOUS.map(f => [f.id, f]));
  let selFam = null;
  const byId = Object.fromEntries(DOGS.map(d => [d.id, d]));
  const regionName = Object.fromEntries(REGIONS.map(r => [r.id, r.name]));
  const WORKS = window.WORKS || [];
  const workName = Object.fromEntries(WORKS.map(w => [w.id, w.name]));
  let kindF = "all", mythOnly = false, work = "", query = "", selected = null, T = d3.zoomIdentity;

  const kind = d => d.tags.includes("common") ? "common" : "local";
  const visible = d => {
    if (mythOnly && !d.myth) return false;
    if (kindF !== "all" && !d.tags.includes(kindF)) return false;
    if (work && !(d.work || []).includes(work)) return false;
    if (!query) return true;
    const q = query.toLowerCase();
    return [d.zh, d.ja, d.en, d.place, d.etym || "", ...(d.aliases || [])].some(s => s.toLowerCase().includes(q));
  };
  const MILE = window.MILESTONES || {}, ANCIENT = window.ANCIENT || {};
  const shownNow = d => visible(d) && !(timeMode && MILE[d.id] && MILE[d.id].year > tlYear);
  const fmtCoord = (lat, lon) => `${Math.abs(lat).toFixed(1)}°${lat >= 0 ? "N" : "S"}  ${Math.abs(lon).toFixed(1)}°${lon >= 0 ? "E" : "W"}`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const isPhone = () => window.matchMedia("(max-width: 640px)").matches;

  // ── Map ──
  const app = document.getElementById("app");
  const svg = d3.select("#map");
  const world = window.WORLD;
  const countries = topojson.feature(world, world.objects.countries);
  const projection = d3.geoNaturalEarth1();
  const path = d3.geoPath(projection);
  const g = svg.append("g");
  const grat = g.append("path").attr("class", "grat");
  const cSel = g.append("g").selectAll("path").data(countries.features).join("path").attr("class", "country")
    .classed("hasdogs", f => DOGS.some(d => d.country.includes(f.id)));
  const relG = g.append("g").attr("class", "rellayer");
  const tripG = g.append("g").attr("class", "trip");
  const pins = g.append("g").selectAll("g.pin").data(DOGS, d => d.id).join("g")
    .attr("class", d => "pin " + kind(d)).attr("tabindex", 0).attr("role", "button")
    .attr("aria-label", d => `${d.zh}，${d.place}`);
  pins.append("circle").attr("class", "hit");
  pins.append("circle").attr("class", "ring");
  pins.append("circle").attr("class", "dot");
  pins.append("text").text(d => d.zh).attr("text-anchor", "middle");
  const starPath = d3.symbol(d3.symbolStar, 120)();
  const fams = g.append("g").attr("class", "famlayer").selectAll("g.fam").data(FAMOUS, f => f.id).join("g")
    .attr("class", "fam").attr("tabindex", 0).attr("role", "button").attr("aria-label", f => `名犬：${f.name}，${f.place}`);
  fams.append("circle").attr("class", "hit").attr("fill", "transparent");
  fams.append("path").attr("d", starPath);

  // The map never moves on its own. Zoom with the wheel, a pinch or the buttons; once zoomed in, drag to pan.
  // At full view the world already fits, so dragging is off there.
  const zoom = d3.zoom().scaleExtent([1, 14]).clickDistance(5)
    .filter(e => {
      if (e.type === "wheel") return true;
      if (e.type === "dblclick") return false;
      const canPan = T.k > 1.01 || isPhone(); // on phones the world is wider than the screen
      if (e.type.startsWith("touch")) return e.touches.length > 1 || canPan;
      return e.type === "mousedown" && e.button === 0 && canPan;
    })
    .on("zoom", e => { T = e.transform; g.attr("transform", T); sizePins(); placePop(); tip.hidden = true; onZoomed(); });
  let hintShown = false;
  function onZoomed() {
    const z = T.k > 1.01;
    app.classList.toggle("zoomed", z);
    if (z && !hintShown) {
      hintShown = true;
      const h = document.getElementById("panhint");
      h.hidden = false; h.style.opacity = "1";
      setTimeout(() => { h.style.opacity = "0"; setTimeout(() => { h.hidden = true; }, 350); }, 3200);
    }
  }

  let W = 0, H = 0, quiz = null, timeMode = false, tlYear = 2026;
  const bar = document.querySelector(".bar");
  const barBottom = () => bar.getBoundingClientRect().bottom - app.getBoundingClientRect().top;
  const ctl = [".seg", ".worksel", ".search"].map(q => document.querySelector(q));
  function placeControls() {
    const phone = isPhone(), host = document.getElementById("drawerctl"), lb = document.getElementById("listbtn");
    if (phone && ctl[0].parentNode !== host) ctl.forEach(n => host.appendChild(n));
    if (!phone && ctl[0].parentNode === host) ctl.forEach(n => bar.insertBefore(n, lb));
    lb.textContent = phone ? "列表" : "犬種列表";
  }
  function layout() {
    placeControls();
    if (!isPhone()) pop.style.height = "";
    else if (sheetH) pop.style.height = sheetH + "px";
    W = app.clientWidth; H = app.clientHeight;
    svg.attr("viewBox", `0 0 ${W} ${H}`);
    const top = barBottom() + 8;
    // During the quiz, keep the world clear of the quiz panel at the bottom.
    const bottom = quiz ? H - (isPhone() ? 250 : 230) : timeMode ? H - (isPhone() ? 230 : 200) : isPhone() ? H - 12 : H - 50;
    if (isPhone()) {
      // Phones are tall: fit the world to the screen height and let people swipe sideways.
      const h = bottom - top, w = h * 1.95;
      projection.fitExtent([[0, top], [w, bottom]], { type: "Sphere" });
      const focus = (selected && byId[selected]) || byId[decodeURIComponent((location.hash || "").slice(1))] || { lon: 110, lat: 25 };
      const [fx] = projection([focus.lon, focus.lat]);
      const [tx, ty] = projection.translate();
      const sb = d3.geoPath(projection).bounds({ type: "Sphere" });
      const shift = Math.max(Math.min(W / 2 - fx, -sb[0][0]), W - sb[1][0]);
      projection.translate([tx + shift, ty]);
    } else {
      projection.fitExtent([[10, top], [W - 10, bottom]], { type: "Sphere" });
    }
    grat.attr("d", path(d3.geoGraticule10()));
    cSel.attr("d", path);
    pins.attr("transform", d => `translate(${projection([d.lon, d.lat])})`);
    fams.attr("transform", f => `translate(${projection([f.lon, f.lat])})`);
    if (selected) drawTrip(byId[selected]);
    if (selected) drawRelations(byId[selected]);
    if (isPhone()) {
      // Allow panning across the whole world, plus room to pull southern dogs up above the card.
      const sb = path.bounds({ type: "Sphere" });
      zoom.extent([[0, 0], [W, H]]).translateExtent([[Math.min(0, sb[0][0]), 0], [Math.max(W, sb[1][0]), H + H * 0.45]]);
    } else {
      zoom.extent([[0, 0], [W, H]]).translateExtent([[0, 0], [W, H]]);
    }
    const dr = document.getElementById("drawer");
    if (dr) dr.style.top = (barBottom() + 8) + "px";
    sizePins(); placePop();
  }

  function sizePins() {
    const k = T.k, s = Math.sqrt(k);
    pins.select("circle.hit").attr("r", 12 / k);
    pins.select("circle.dot").attr("r", d => (d.id === selected ? 7.5 : 5.5) / s);
    pins.select("circle.ring").attr("r", 12 / s);
    pins.select("text").attr("font-size", 13 / k).attr("stroke-width", 3 / k);
    fams.select("path").attr("transform", f => `scale(${(f.id === selFam ? 1.35 : 1) / s})`);
    fams.select("circle.hit").attr("r", 12 / k);
    tripG.selectAll("circle").attr("r", 9 / s);
    tripG.selectAll("text.num").attr("font-size", 11 / s).attr("dy", 3.8 / s);
    tripG.selectAll("text.where").attr("font-size", 13 / k).attr("dy", 4.5 / k).attr("stroke-width", 3 / k);
    layoutStops();
    tripG.selectAll("path.arrow").attr("transform", function () {

  // Show a name only where it fits: try above the dot, then below; skip it if it would overlap another label.
  let hoverId = null;
  function placeLabels() {
    const k = T.k, s = Math.sqrt(k);
    const minK = isPhone() ? 1 : 2.4;
    const boxes = [], show = new Map();
    const hit = (a) => boxes.some(b => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0);
    if (k >= minK) {
      // Treat every visible dot as an obstacle so names never sit on top of another dog's dot.
      for (const d of DOGS) {
        if (!shownNow(d)) continue;
        const [x, y] = T.apply(projection([d.lon, d.lat])), r = (d.id === selected ? 9 : 7) / Math.sqrt(s);
        boxes.push({ x0: x - r, x1: x + r, y0: y - r, y1: y + r, dot: true });
      }
      if (!app.classList.contains("nofam")) for (const f of FAMOUS) {
        const [x, y] = T.apply(projection([f.lon, f.lat])), r = 8;
        boxes.push({ x0: x - r, x1: x + r, y0: y - r, y1: y + r, dot: true });
      }
      const order = DOGS.filter(d => shownNow(d) && d.id !== selected)
        .sort((a, b) => (b.id === hoverId) - (a.id === hoverId) || (b.tags.includes("common")) - (a.tags.includes("common")));
      for (const d of order) {
        const [x, y] = T.apply(projection([d.lon, d.lat]));
        if (x < -40 || x > W + 40 || y < -20 || y > H + 20) continue;
        const w = d.zh.length * 13 + 6, r = 10 * s / 1;
        const cands = [["above", { x0: x - w / 2, x1: x + w / 2, y0: y - r - 18, y1: y - r + 1 }],
                       ["below", { x0: x - w / 2, x1: x + w / 2, y0: y + r - 1, y1: y + r + 18 }],
                       ["right", { x0: x + r + 1, x1: x + r + 3 + w, y0: y - 9, y1: y + 9 }],
                       ["left", { x0: x - r - 3 - w, x1: x - r - 1, y0: y - 9, y1: y + 9 }]];
        for (const [pos, b] of cands) { if (!hit(b)) { boxes.push(b); show.set(d.id, pos); break; } }
      }
    }
    pins.select("text")
      .attr("display", d => show.has(d.id) ? null : "none")
      .attr("text-anchor", d => ({ right: "start", left: "end" })[show.get(d.id)] || "middle")
      .attr("x", d => { const p = show.get(d.id); return p === "right" ? 10 / s + 2 / k : p === "left" ? -10 / s - 2 / k : 0; })
      .attr("y", d => { const p = show.get(d.id); return p === "below" ? (10 / s + 13 / k) : p === "above" ? (-10 / s - 3 / k) : 4.5 / k; });
  }

  svg.call(zoom).on("dblclick.zoom", null);

  // ── Popup ──

  function renderFamous(f) {

  let userPos = null, sheetH = null;
  const current = () => selFam ? famById[selFam] : byId[selected];
  function placePop() {
    if (pop.hidden || !(selected || selFam) || isPhone()) return;
    const d = current();
    const [px, py] = T.apply(projection([d.lon, d.lat]));
    // If the pin is zoomed out of view, keep the card on screen and drop the arrow.
    const off = px < 0 || px > W || py < 0 || py > H;
    const minTop = barBottom() + 8; // never cover the controls at the top, even when they wrap to two rows

      userPos.top = Math.max(minTop, Math.min(userPos.top, H - ph0 - 8));

      return;
    }

    const top = Math.max(minTop, Math.min(y - 70, H - ph - 12));
    // Pick the side that fits and hides the fewest related dogs (so their connecting lines stay visible).
    // Keep related dogs, journey stops and the linked breed visible beside the card.
    const relIds = selFam ? (d.breed ? [d.breed] : []) : (d.related || []).map(r => r.id);
    const relPts = relIds.filter(id => byId[id] && visible(byId[id])).map(id => T.apply(projection([byId[id].lon, byId[id].lat])))
      .concat(((!selFam && TRIPS[d.id]) || []).map(([la, lo]) => T.apply(projection([lo, la]))));

    pop.classList.toggle("right", side === "right"); pop.classList.toggle("left", side === "left");

  }

  function openPop(d, render) {

  // Drag the card: on desktop by its photo or the grip bar (moves it); on phones by the grip (resizes the sheet, drag down to close).

  });
  function step(n) {

    }

  document.addEventListener("keydown", e => {

  // Random dog: prefer ones this viewer has not opened yet, so it helps fill the collection.
  document.getElementById("rand").addEventListener("click", () => {
    const list = DOGS.filter(visible); if (!list.length) return;

  });

  // ── Drawer ──
  const drawer = document.getElementById("drawer"), listbtn = document.getElementById("listbtn");
  const drawerList = document.getElementById("drawerlist");
  function renderDrawer() {
    const html = REGIONS.map(r => {
      const ds = DOGS.filter(d => d.region === r.id && visible(d));

      const all = DOGS.filter(d => d.region === r.id), got = all.filter(d => seen.has(d.id)).length;
      return `<section><h3>${r.name}<small>${got}／${all.length}</small>${got === all.length ? '<span class="badge">集滿了</span>' : ""}</h3><div class="chips">${ds.map(d =>
        `<button type="button" class="chip ${kind(d) === "local" ? "local" : ""} ${d.id === selected ? "on" : ""} ${seen.has(d.id) ? "seen" : ""}" data-go="${d.id}">${esc(d.zh)}</button>`).join("")}</div></section>`;

      (html || `<p class="empty">${empty}</p>`) +
      `<p class="about">資料整理自 Wikipedia、美國犬業俱樂部（AKC）、大英百科全書、各犬種協會與博物館等公開資料；照片來自 Wikimedia Commons，作者與授權標在每張照片下方。犬種起源常有多種說法，有分歧的地方會特別標出。地圖圓點標的是大致的原產區域。</p>

    if (e.target.closest("[data-reset]")) {

  function select(id, opts) {
    const d = byId[id]; if (!d) return;

    fams.classed("sel", false);

  // Keep journey stops readable when they sit close together on screen:
  // nudge a marker that would cover an earlier one, and put each place name on the right, the left, or hide it.
  function layoutStops() {
    const k = T.k, s = Math.sqrt(k), placed = [], boxes = [];
    tripG.selectAll("g.stop").each(function () {
      const g0 = d3.select(this);
      const [lat, lon] = g0.datum() || [];
      if (lat === undefined) return;
      let [x, y] = T.apply(projection([lon, lat]));
      let dy = 0;
      while (placed.some(([px, py]) => Math.hypot(px - x, py - (y + dy)) < 20)) dy -= 20;
      placed.push([x, y + dy]);
      g0.attr("transform", `translate(${projection([lon, lat])}) translate(0,${dy / k})`);
      const label = g0.select("text.where"), w = label.text().length * 13 + 6;
      const right = { x0: x + 12, x1: x + 12 + w, y0: y + dy - 9, y1: y + dy + 9 };
      const left = { x0: x - 12 - w, x1: x - 12, y0: y + dy - 9, y1: y + dy + 9 };
      const hit = b => boxes.some(o => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0)
        || placed.some(([px, py]) => px > b.x0 - 9 && px < b.x1 + 9 && py > b.y0 - 9 && py < b.y1 + 9 && !(px === x && py === y + dy));
      if (!hit(right)) { boxes.push(right); label.attr("display", null).attr("text-anchor", "start").attr("x", 13 / s); }
      else if (!hit(left)) { boxes.push(left); label.attr("display", null).attr("text-anchor", "end").attr("x", -13 / s); }
      else label.attr("display", "none");
    });
  }
  // Numbered journey route for breeds that travelled.
  function drawTrip(d) {
    tripG.selectAll("*").remove();
    const stops = (d && TRIPS[d.id]) || [];
    if (stops.length < 2) return;
    for (let i = 1; i < stops.length; i++) {
      const a = [stops[i - 1][1], stops[i - 1][0]], b = [stops[i][1], stops[i][0]];
      const leg = tripG.append("path").attr("class", "leg").attr("d", path({ type: "LineString", coordinates: [a, b] }));
      const L = leg.node().getTotalLength();
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches && L > 0) {
        leg.attr("stroke-dasharray", `${L} ${L}`).attr("stroke-dashoffset", L)
          .transition().delay(250 + (i - 1) * 550).duration(550).ease(d3.easeCubicInOut).attr("stroke-dashoffset", 0)
          .on("end", function () { d3.select(this).attr("stroke-dasharray", null); });
      }
    }
    // Arrowhead at the middle of each leg so the direction of travel is clear.
    tripG.selectAll("path.leg").each(function () {
      const L = this.getTotalLength(); if (L < 30) return;
      const m = this.getPointAtLength(L / 2), n = this.getPointAtLength(Math.min(L, L / 2 + 1));
      const ang = Math.atan2(n.y - m.y, n.x - m.x) * 180 / Math.PI;
      tripG.append("path").attr("class", "arrow").attr("d", "M5,0L-4,-4.5L-4,4.5Z")
        .attr("data-x", m.x).attr("data-y", m.y).attr("data-a", ang);
    });
    stops.forEach(([la, lo, , where], i) => {
      const gg = tripG.append("g").attr("class", "stop").datum([la, lo]).attr("transform", `translate(${projection([lo, la])})`);
      gg.append("circle");
      gg.append("text").attr("class", "num").attr("text-anchor", "middle").text(i + 1);
      gg.append("text").attr("class", "where").attr("text-anchor", "start").text(where);
    });
    tripG.raise();
    sizePins();
  }
  // Dashed great-circle lines from the open dog to its related dogs.

  // ── Quiz: guess where each dog comes from ──

  const scoreFor = dist => dist <= 300 ? 100 : Math.max(0, Math.round(100 - (dist - 300) / 47));
  const rank = s => s >= 800 ? "環遊世界的狗狗博士" : s >= 600 ? "很懂狗的地理通" : s >= 350 ? "正在認識世界的旅人" : "剛出門散步的小狗";

  function startQuiz(kind) {

    // A name-origin clue needs enough left after masking to be answerable (otherwise it is just blanks).
    const answerable = d => maskClue(d).replace(/＿＿/g, "").replace(/[\s。，；：、「」（）]/g, "").length >= 10;
    const pool = shuffle(DOGS.filter(d => (kind !== "photo" || PHOTOS[d.id]) && (kind !== "etym" || (d.etym && answerable(d)))).slice());
    quiz = { kind, list: pool.slice(0, ROUNDS), i: 0, score: 0, results: [], hint: false, guessed: false };

  // Hide anything in a name-origin clue that would give the answer away:
  // any 2+ character piece of the Chinese name or aliases, and the English name (plus close forms like Peking/Pekingese).
  function maskClue(d) {
    let clue = d.etym || "";
    const pieces = new Set();
    for (const n of [d.zh, ...(d.aliases || [])]) {
      const core = n.replace(/[（(].*$/, "").replace(/(犬|狗)$/, "");
      for (let len = core.length; len >= 2; len--)
        for (let i = 0; i + len <= core.length; i++) pieces.add(core.slice(i, i + len));
    }
    [...pieces].sort((a, b) => b.length - a.length).forEach(p => { if (clue.includes(p)) clue = clue.split(p).join("＿＿"); });
    const generic = new Set(["dog", "the", "of", "and"]);
    const enWords = d.en.replace(/[（(].*$/, "").split(/[^A-Za-zÀ-ÿ]+/).filter(w => w.length >= 4 && !generic.has(w.toLowerCase()));
    clue = clue.replace(/[A-Za-zÀ-ÿ]{4,}/g, w => enWords.some(e => w.toLowerCase() === e.toLowerCase() ||
      (w.length >= 5 && e.length >= 5 && w.slice(0, 5).toLowerCase() === e.slice(0, 5).toLowerCase())) ? "＿＿" : w);
    return clue.replace(/(＿＿)+/g, "＿＿");
  }
  // Photo quiz: four choices, wrong ones from the same region when possible so it is not too easy.
  function renderPhotoQuestion() {

    pins.classed("sel", false);
    const same = shuffle(DOGS.filter(x => x.id !== d.id && x.region === d.region));
    const other = shuffle(DOGS.filter(x => x.id !== d.id && x.region !== d.region));
    const opts = shuffle([d, ...same.slice(0, 2), ...other].slice(0, 4));
    const ph = PHOTOS[d.id];
    const clue = maskClue(d);
    const body = quiz.kind === "etym"
      ? `<blockquote class="qclue">${esc(clue)}</blockquote>`

    quizEl.innerHTML = `${qHead()}
      ${body}
      <p class="qask">${quiz.kind === "etym" ? "這是哪一種狗的名字由來？" : "這是哪一種狗？"}</p>
      <div class="qopts">${opts.map(o => `<button type="button" data-pick="${o.id}">${esc(o.zh)}</button>`).join("")}</div>
      <div class="qbtns"><button type="button" data-q="quit">結束遊戲</button></div>`;

  function pickPhoto(id) {

  function qHead() {

  }
  function qDog(d) {

  function renderQuestion() {

      <p class="qask">牠的老家在哪裡？<b>在地圖上點一下</b>你猜的位置。${isPhone() ? "可以先用雙指放大再點。" : "可以先用滾輪放大再點。"}</p>
      <div class="qbtns">

        <button type="button" data-q="quit">結束遊戲</button>

  function guess(lonlat) {
    const d = quiz.list[quiz.i];
    const dist = d3.geoDistance(lonlat, [d.lon, d.lat]) * 6371;

    quizG.append("circle").attr("class", "qans").attr("transform", `translate(${projection([d.lon, d.lat])})`);
    quizG.append("text").attr("class", "qlabel").attr("text-anchor", "middle").text(d.zh)
      .attr("transform", `translate(${projection([d.lon, d.lat])})`);

    const msg = dist <= 300 ? "幾乎猜中！" : dist <= 1500 ? "很接近了！" : dist <= 4000 ? "方向對了。" : "差得有點遠。";
    const last = quiz.i === ROUNDS - 1;
    quizEl.innerHTML = `${qHead()}
      <p class="qbig">${msg}<small>差了 ${km(dist)} 公里，得 ${pts} 分${quiz.hint ? "（用了提示）" : ""}</small></p>

  function renderSummary() {

  function sizeQuiz() {

  // ── Breed timeline ──
  const tl = document.getElementById("tl"), tlRange = document.getElementById("tlrange");
  const tlEvents = Object.entries(MILE).map(([id, m]) => ({ id, ...m })).sort((a, b) => a.year - b.year);
  let tlTimer = null;
  // Year ticks placed at their true position on the 1550–2026 scale.
  document.getElementById("tlticks").innerHTML = [1600, 1700, 1800, 1900, 2000]
    .map(y => `<span style="left:${((y - 1550) / (2026 - 1550) * 100).toFixed(2)}%">${y}</span>`).join("");
  function setYear(y, fromPlay) {
    const prev = tlYear; tlYear = y; tlRange.value = y;
    pins.classed("future", d => !!MILE[d.id] && MILE[d.id].year > y)
        .classed("undated", d => !MILE[d.id] && !ANCIENT[d.id]);

    const last = tlEvents.filter(e => e.year <= y).pop();
    document.getElementById("tlevent").innerHTML = last
      ? `${esc(last.label || last.year + " 年")}｜<button type="button" data-go="${last.id}">${esc(byId[last.id].zh)}</button>：${esc(last.text)}`
      : `一開始就有的古老犬種：${Object.keys(ANCIENT).filter(id => byId[id]).map(id => `<button type="button" data-go="${id}">${esc(byId[id].zh)}</button>`).join("、")}`;

  function startTimeline() {
    if (quiz) endQuiz();
    closePop(); toggleDrawer(false);
    timeMode = true; app.classList.add("timemode"); tl.hidden = false;
    svg.call(zoom.transform, d3.zoomIdentity); layout();
    setYear(1550); play();
  }
  function endTimeline() {
    stopPlay(); timeMode = false; tlYear = 2026;
    app.classList.remove("timemode"); tl.hidden = true;
    pins.classed("future", false).classed("undated", false);
    layout(); applyFilter();
  }
  document.getElementById("timebtn").addEventListener("click", startTimeline);
  document.getElementById("tlclose").addEventListener("click", endTimeline);
  document.getElementById("tlplay").addEventListener("click", () => tlTimer ? stopPlay() : play());
  tlRange.addEventListener("input", () => { clearInterval(tlTimer); tlTimer = null; setYear(+tlRange.value); stopPlay(); });
  tl.addEventListener("click", e => { e.stopPropagation(); const t = e.target.closest("[data-go]"); if (t) { stopPlay(); select(t.dataset.go); } });
  document.addEventListener("keydown", e => { if (timeMode && e.key === "Escape" && pop.hidden) endTimeline(); });

  // Tap a country to see its dogs: one dog opens directly, several show a small list where you tapped.
  const cpick = document.getElementById("cpick");
  cSel.on("click", (e, f) => {
    if (quiz || timeMode) return; // let the quiz / timeline handle map clicks
    const here = DOGS.filter(d => d.country.includes(f.id) && visible(d));
    if (!here.length) return;
    e.stopPropagation();
    if (here.length === 1) { cpick.hidden = true; return select(here[0].id); }
    showPick(e, `這個國家的狗（${here.length}）`, here);
  });
  function showPick(e, title, list) {
    const [x, y] = d3.pointer(e, app);
    cpick.innerHTML = `<p>${esc(title)}</p><div class="chips">${list.map(d =>
      `<button type="button" class="chip ${kind(d) === "local" ? "local" : ""}" data-go="${d.id}">${esc(d.zh)}</button>`).join("")}</div>`;
    cpick.hidden = false;
    const w = cpick.offsetWidth, h = cpick.offsetHeight;
    cpick.style.left = Math.max(12, Math.min(x - w / 2, W - w - 12)) + "px";
    cpick.style.top = Math.max(barBottom() + 8, Math.min(y + 12, H - h - 12)) + "px";
  }
  cpick.addEventListener("click", e => {
    e.stopPropagation();
    const t = e.target.closest("[data-go]"); if (!t) return;
    cpick.hidden = true; select(t.dataset.go);
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") cpick.hidden = true; });
  zoom.on("zoom.cpick", () => { cpick.hidden = true; });

  // First visit only: a one-line hint on how to use the map (remembered in this browser).
  const welcome = document.getElementById("welcome");
  let welcomed = false;
  try { welcomed = localStorage.getItem("dogmap-welcomed") === "1"; } catch (_) {}
  const dismissWelcome = () => {
    welcome.hidden = true;
    try { localStorage.setItem("dogmap-welcomed", "1"); } catch (_) {}
  };
  if (!welcomed) welcome.hidden = false;
  document.getElementById("welcomeok").addEventListener("click", dismissWelcome);
  // Opening any dog also counts as having got the idea.
  const _select = select;
  let started = false; // the dog opened from the link at load time does not count
  select = function (id, opts) { if (started && !welcome.hidden) dismissWelcome(); return _select(id, opts); };

  window.addEventListener("resize", layout);
  layout(); applyFilter();
  pop.classList.remove("enter");
  const fromHash = decodeURIComponent((location.hash || "").slice(1));
  if (byId[fromHash]) select(fromHash);
  else if (fromHash.startsWith("f-") && famById[fromHash.slice(2)]) selectFamous(fromHash.slice(2));
  else if (!isPhone()) select("labrador", { auto: true });
  pop.classList.remove("enter");
  started = true;
  window.addEventListener("hashchange", () => {
    const h = decodeURIComponent(location.hash.slice(1)); if (quiz) return;
    if (byId[h]) select(h); else if (h.startsWith("f-") && famById[h.slice(2)]) selectFamous(h.slice(2));
  });

  // ── Self-test: open the page with ?selftest to click through everything and report errors ──
  if (/[?&]selftest\b/.test(location.search)) runSelfTest();
  async function runSelfTest() {
    const problems = [], wait = ms => new Promise(r => setTimeout(r, ms));
    window.addEventListener("error", e => problems.push("程式錯誤：" + e.message));
    const check = (ok, msg) => { if (!ok) problems.push(msg); };
    const savedSeen = new Set(seen); // the test opens every dog; put the viewer's collection back afterwards
    // Run one step; an exception is recorded as a problem instead of stopping the whole test.
    const tryStep = (label, fn) => { try { fn(); } catch (e) { problems.push(`${label}時出錯：${e.message}`); } };
    const title = () => (document.querySelector(".pop h2") || {}).textContent;
    await wait(300);
    // Every breed and famous dog opens its own card (also in reverse, to switch between routes and no routes).
    for (const d of DOGS.concat(DOGS.slice().reverse())) tryStep(`打開「${d.zh}」`, () => { select(d.id); check(title() === d.zh, `打不開「${d.zh}」的卡片`); });
    for (const f of FAMOUS) tryStep(`打開名犬「${f.name}」`, () => { selectFamous(f.id); check(title() === f.name, `打不開名犬「${f.name}」`); });
    for (const d of DOGS) { const ph = PHOTOS[d.id]; check(ph && ph.file, `「${d.zh}」沒有照片資料`); }
    // Next / previous and random
    tryStep("上一隻／下一隻", () => {
      select(DOGS[0].id); step(1); check(title() === DOGS[1].zh, "「下一隻」沒有換到下一隻");
      step(-1); check(title() === DOGS[0].zh, "「上一隻」沒有換回上一隻");
    });
    tryStep("隨機一隻", () => { document.getElementById("rand").click(); check(!!title(), "「隨機一隻」沒有打開卡片"); });
    // Filters
    for (const b of document.querySelectorAll(".kindbtn")) { b.click(); check(DOGS.filter(visible).length > 0, "種類篩選後沒有狗"); b.click(); }
    document.getElementById("mode-myth").click(); check(DOGS.filter(visible).every(d => d.myth), "名字的誤會篩選不正確");
    document.getElementById("mode-myth").click(); check(DOGS.filter(visible).length === DOGS.length, "取消篩選後沒有回到全部");
    // Both games
    tryStep("關閉卡片", () => closePop());
    const gameName = { photo: "看照片猜品種", etym: "猜名字由來", map: "猜老家" };
    for (const mode of ["photo", "etym", "map"]) tryStep(gameName[mode], () => {
      startQuiz(mode);
      for (let i = 0; i < 10; i++) {
        if (mode !== "map") { const b = quizEl.querySelector("[data-pick]"); if (!b) break; b.click(); }
        else { const d = quiz.list[quiz.i]; guess([d.lon + 1, d.lat]); }
        const n = quizEl.querySelector('[data-q="next"]'); if (n) n.click();
      }
      check(quizEl.textContent.includes("遊戲結束"), `「${gameName[mode]}」沒有跑到總成績`);
      endQuiz();
    });
    // Timeline
    tryStep("年表", () => {
      startTimeline(); stopPlay();
      for (const y of [1550, 1700, 1868, 1931, 2026]) { tlRange.value = y; tlRange.dispatchEvent(new Event("input")); }
      check(!document.querySelector(".pin.future"), "年表拉到 2026 年時，還有狗沒出現");
      endTimeline();
    });
    seen = savedSeen;
    try { localStorage.setItem(SEEN_KEY, JSON.stringify([...seen])); } catch (_) {}
    updateCount(); renderDrawer();
    // Report
    const box = document.createElement("div");
    box.setAttribute("role", "status");
    box.style.cssText = "position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);max-width:90vw;padding:16px 20px;border-radius:12px;font:15px/1.7 var(--font-body);box-shadow:var(--shadow);" +
      (problems.length ? "background:#b3261e;color:#fff" : "background:#1f7a3f;color:#fff");
    box.innerHTML = problems.length
      ? `<b>自我檢查發現 ${problems.length} 個問題</b><br>${problems.slice(0, 12).map(esc).join("<br>")}`
      : `<b>自我檢查通過</b><br>${DOGS.length} 種狗、${FAMOUS.length} 隻名犬、三種遊戲和年表都正常。`;
    app.appendChild(box);
    console.log(problems.length ? "SELFTEST FAIL\n" + problems.join("\n") : "SELFTEST PASS");
  }
})();
</script>
